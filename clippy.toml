# clippy.toml — custom lint configuration for Recto

# Disallow certain patterns project-wide
disallowed-methods = []

# Relax some pedantic lints that are noisy in GTK/glib code
allow-unwrap-in-tests = true

# Lint levels live in [workspace.lints] in Cargo.toml; `make check` (also
# run by .github/workflows/check.yml) denies all warnings.
