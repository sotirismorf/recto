[workspace]
resolver = "2"
members = ["crates/core", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sotiris Morfakidis"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1
