[workspace]
resolver = "2"
members = ["crates/core", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Sotiris Morfakidis"]
description = "Recto — The powerful post-processor for book scanning"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rayon = "1.10"
image = "0.25"
kamadak-exif = "0.6"
tempfile = "3"
pdf-writer = "0.14"
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 1
