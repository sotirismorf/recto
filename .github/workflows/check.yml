name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch ships the OpenCV 5, GTK 4 and libadwaita versions the app builds
    # against; Ubuntu's are too old.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git clang rustup \
            gtk4 libadwaita opencv
          rustup default stable
          rustup component add rustfmt clippy
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: make check
        run: make check
